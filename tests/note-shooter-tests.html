function pianoFrame(out,rate,midi,age,previous=.08,detune=0){
 const f=440*2**((midi-69)/12)*2**(detune/1200),partials=[.64,.85,.46,.36,.20].map((volume,i)=>[volume,2*Math.PI*f*(i+1)*Math.sqrt(1+.0002*(i+1)**2)]);
 let seed=179;
 for(let i=0;i<out.length;i++){
  const t=(i-out.length)/rate+age;
  seed=(1664525*seed+1013904223)>>>0;
  let value=0;
  if(t<0)value=previous*Math.sin(2*Math.PI*440*t);
  else for(const [volume,angular]of partials)value+=.15*volume*Math.exp(-t/.04)*Math.sin(angular*t);
  out[i]=value+(seed/2**32-.5)*.001;
 }
 return out;
}

  const P=w.PitchDetector,detect=P.detector({pianoAttack:true});
  for(const rate of [32000,44100,48000,96000])for(const midi of [40,43,60,79,83,84]){
   const gate=P.stability({minClarity:.88,maxDrift:26,allowedGaps:1}),buffer=new Float32Array(8192);
   let accepted=null;
