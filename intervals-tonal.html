<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141a"><title>Интервалы в тональности — тренажёр слуха</title><style>
:root{color-scheme:dark;--bg:#10141a;--panel:#191f27;--edge:#303b45;--ink:#f1f4f6;--muted:#a8b4bd;--accent:#b4dbca;--green:#61e2a2;--red:#ff7474}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#25363a 0%,transparent 52%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,600px);position:relative}.card{position:relative;overflow:hidden;border:1px solid #3c454d;border-radius:26px;background:linear-gradient(180deg,#1b232c,#171d24);box-shadow:0 20px 90px #0005;padding:26px 28px 22px;isolation:isolate}.card::before{position:absolute;content:"";inset:0;border-radius:inherit;pointer-events:none;z-index:-1}.card.good::before{background:linear-gradient(160deg,#174b37cc,#1a272400 68%)}.card.bad::before{background:linear-gradient(160deg,#632a33cc,#1e232800 68%)}
.headrow{display:flex;gap:10px;align-items:center;justify-content:space-between}h1{font-size:18px;line-height:1.2;margin:0;font-weight:600;letter-spacing:normal}.back-link{display:inline-flex;align-items:center;min-height:32px;color:#b2d9c8;font-size:11px;text-decoration:none;white-space:nowrap}.back-link:focus-visible,.mode-btn:focus-visible,.soft:focus-visible,.choice:focus-visible,.orb-start:focus-visible{outline:2px solid #d5f8e2;outline-offset:3px}
.controls{display:grid;gap:7px;margin-top:14px}.control-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}.level-select,.answer-select{background:#111820;border:1px solid #38454e;border-radius:9px;color:#c8d5dc;font:600 12px/1.2 inherit;padding:7px 8px;min-height:36px;max-width:172px}.level-select{max-width:136px}.answer-select{max-width:136px}.mode-switch{background:#111820;border:1px solid #38454e;border-radius:10px;padding:2px;display:flex;gap:2px;flex-shrink:0}.mode-btn{border:0;background:transparent;color:#aebec8;padding:6px 8px;border-radius:7px;font-weight:600;font-size:12px;line-height:1.2;cursor:pointer;white-space:nowrap;min-height:32px}.mode-btn.active{color:#15251e;background:#b3ddca;box-shadow:0 2px 8px #0003}.mode-btn:disabled{opacity:.35;cursor:default}.tool-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}.soft{background:transparent;border:1px solid #43515b;color:#c2d0d5;border-radius:9px;padding:7px 10px;font:600 12px/1.2 inherit;min-height:34px;cursor:pointer}.soft:disabled{opacity:.35;cursor:default}.endless{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}.endless input{accent-color:var(--accent);width:15px;height:15px}
.audio-area{height:104px;display:flex;align-items:center;justify-content:center;position:relative}.orb{position:relative;width:96px;height:96px;border:1px solid #46575c;border-radius:50%;background:radial-gradient(circle at 44% 38%,#32494d,#1e3036 65%,#18252c);display:grid;place-items:center;box-shadow:inset 0 0 35px #101c2455,0 12px 42px #0005}.orb.playing{box-shadow:0 0 0 8px #8cd5c60c,0 0 0 19px #8cd5c608,inset 0 0 28px #79ccb51c}.good .orb{border-color:#58d99b;background:radial-gradient(circle,#236344,#173a30)}.bad .orb{border-color:#fa7979;background:radial-gradient(circle,#813c44,#48262d)}
.bars{height:54px;display:flex;gap:5px;align-items:center;justify-content:center}.bar{height:18px;width:5px;border-radius:99px;background:var(--accent);opacity:.88}.orb.playing .bar:nth-child(1){animation:equalize .48s ease-in-out infinite alternate}.orb.playing .bar:nth-child(2){animation:equalize .67s ease-in-out -.15s infinite alternate}.orb.playing .bar:nth-child(3){animation:equalize .52s ease-in-out -.25s infinite alternate}.orb.playing .bar:nth-child(4){animation:equalize .61s ease-in-out -.11s infinite alternate}.orb.playing .bar:nth-child(5){animation:equalize .43s ease-in-out -.36s infinite alternate}.orb.playing .bar:nth-child(6){animation:equalize .74s ease-in-out -.44s infinite alternate}@keyframes equalize{to{height:45px}from{height:9px}}
.feedback-icon{display:none;font-size:62px;font-weight:600;line-height:1;color:#d7ffee}.bad .feedback-icon{color:#ffb5b5}.good .feedback-icon,.bad .feedback-icon{display:block}.good .bars,.bad .bars{display:none}.orb-start{color:#c9f8df;border:0;cursor:pointer;background:transparent;display:none;flex-direction:column;align-items:center;gap:6px;font-size:24px;padding:8px}.orb-start small{font-size:9px;font-weight:800;letter-spacing:2px}.idle .bars{display:none}.idle .orb-start{display:flex}.idle .orb{border-color:#588776}
.replay-control{display:none;width:100%;min-height:54px;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:0;background:transparent;color:#c9f8df;cursor:pointer;font:600 13px/1.2 inherit}.card:not(.idle) .orb:not(.playing):has(> .replay-control:not(:disabled)) > :is(.bars,.feedback-icon){visibility:hidden}.card:not(.idle) .orb:has(> .replay-control:not(:disabled)) > .replay-control{display:flex}.replay-symbol{font-size:22px}.space-hint{font-size:9px;opacity:.52}.card:is(.bad,.good) .orb.playing > .replay-control:not(:disabled){visibility:visible}.card:is(.bad,.good) .orb.playing .feedback-icon{visibility:hidden}
.prompt{text-align:center;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.prompt strong{font-size:16px;font-weight:660}.prompt small{font-size:12px;color:var(--muted)}.good .prompt strong{color:var(--green)}.bad .prompt strong{color:var(--red)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:11px}.choice{color:var(--ink);background:#26303a;border:1px solid #424e58;border-radius:13px;cursor:pointer;min-height:48px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:border-color .12s,background .12s,transform .12s}.choice:hover:not(:disabled){background:#31414b;border-color:#a0bfb4;transform:translateY(-1px)}.choice:disabled{cursor:default;opacity:.65}.choice.correct{background:#1d6344;border:1px solid #58da9f;color:#dcffec;opacity:1}.choice.wrong{background:#6b3038;border:1px solid #ff8588;color:#fff0f1;opacity:1}.answers[hidden],.perform[hidden],.summary[hidden]{display:none}
.perform{border:1px solid #35434d;border-radius:13px;background:#141b22;padding:12px;margin-top:11px;text-align:center}.perform strong{display:block;font-size:14px;font-weight:650}.perform small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.perform .live{margin-top:8px;min-height:20px;font-size:12px;color:var(--accent)}
.feedback{min-height:22px;margin-top:8px;text-align:center;font-size:13px}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.feedback .association-name{color:var(--accent)}.explanation{min-height:17px;color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:11px 6px;margin-top:10px;border:1px solid #2f3941;border-radius:15px;text-align:center;background:#151b22}.metric{min-width:0;padding:0 1px}.metric+.metric{border-left:1px solid #34404a}.metric b{font-size:20px;display:block;font-weight:660}.metric span{font-size:9px;color:var(--muted);margin-top:4px;display:block;white-space:nowrap}.bottom{display:flex;align-items:center;justify-content:center;gap:8px 12px;flex-wrap:wrap;margin:10px 4px 0;color:#a5b2ba;font-size:11px}.bottom label{display:flex;align-items:center;gap:5px;white-space:nowrap}.bottom input{accent-color:var(--accent);width:15px;height:15px}.bottom button{border:0;background:none;color:#b2d9c8;text-decoration:underline;cursor:pointer;font-size:11px;padding:4px}
.summary{border:1px solid #35434d;border-radius:16px;background:#141b22;padding:14px;margin-top:12px}.summary h2{font-size:18px;margin:0 0 8px;font-weight:650}.summary p{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.4}.summary .summary-table{margin:8px 0;display:grid;gap:3px}.summary-row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px;color:#d6e0e5}.summary-row b{font-weight:600}.summary-row span{color:var(--muted)}.summary button{margin-top:7px;border:0;border-radius:11px;background:#b4dbca;color:#122822;font:700 14px/1.2 inherit;padding:11px 16px;min-height:44px;cursor:pointer}
.credits{width:min(100%,600px);margin:12px auto 0;color:#98aab5;font-size:10px;line-height:1.4;text-align:center}.credits a{color:#b2d9c8}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}.card.summary-mode :is(.audio-area,.prompt,.answers,.perform,.tool-row){display:none}
@media(max-width:530px){html{height:100%}body{height:auto;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;padding:max(11px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(11px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}main{height:auto;flex:none;margin:0 auto;display:flex;flex-direction:column}.card{padding:18px 16px 16px;border-radius:22px;display:flex;flex-direction:column}h1{font-size:18px}.audio-area{height:100px;min-height:100px;flex:none}.orb{width:94px;height:94px}.prompt{min-height:44px}.choice{min-height:46px;font-size:15px}.metrics{padding:10px 4px}.metric b{font-size:19px}.metric span{font-size:clamp(8px,2.2vw,9px)}.bottom{margin-top:8px}.feedback:empty{min-height:0;margin-top:0}.explanation:empty{min-height:0}.summary{padding:12px}}
@media(max-width:420px){h1{font-size:17px}}
@media(max-width:380px){h1{font-size:16px}.level-select{max-width:124px}.mode-btn{padding:6px 7px}.answer-select{max-width:124px}}
@media(prefers-reduced-motion:reduce){.orb.playing .bar{animation:none}.choice{transition:none}}
</style></head><body><main><section class="card idle" id="card" aria-label="Интервалы в тональности">
<div class="headrow"><h1>Интервалы в тональности</h1><a class="back-link" href="./index.html">← К упражнениям</a></div>
<div class="controls">
 <div class="control-row">
  <label class="visually-hidden" for="levelSelect">Уровень</label><select id="levelSelect" class="level-select" aria-label="Уровень"></select>
  <div class="mode-switch" role="group" aria-label="Направление"><button type="button" class="mode-btn active" data-dir="1" aria-label="Вверх" aria-pressed="true">↑</button><button type="button" class="mode-btn" data-dir="-1" aria-label="Вниз" aria-pressed="false">↓</button><button type="button" class="mode-btn" data-dir="0" aria-label="Вместе" aria-pressed="false">Вместе</button></div>
 </div>
 <div class="control-row">
  <div class="mode-switch" role="group" aria-label="Тип вопроса"><button type="button" class="mode-btn active" data-type="tonic" aria-label="От тоники" aria-pressed="true">От тоники</button><button type="button" class="mode-btn" data-type="between" aria-label="Между ступенями" aria-pressed="false" disabled>Между</button></div>
  <label class="visually-hidden" for="answerMode">Способ ответа</label><select id="answerMode" class="answer-select" aria-label="Способ ответа"><option value="buttons">Кнопки</option><option value="midi">Инструмент (MIDI)</option><option value="voice">Голос (микрофон)</option></select>
 </div>
</div>
<div class="tool-row"><button type="button" id="tonic" class="soft" disabled>Тоника (Т)</button><button type="button" id="hint" class="soft" disabled>Подсказка</button><label class="endless"><input id="endless" type="checkbox">Без конца</label></div>
<div class="audio-area"><div class="orb" id="orb"><button class="replay-control" id="repeat" type="button" disabled><span class="replay-symbol">↻</span><span id="repeatLabel">Повторить вопрос</span><span class="space-hint">ПРОБЕЛ</span></button><button type="button" id="start" class="orb-start" aria-label="Начать тренировку"><span aria-hidden="true">▶</span><small>НАЧАТЬ</small></button><div class="bars"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div><div class="feedback-icon" id="feedbackIcon"></div></div></div>
<div class="prompt" aria-live="polite"><strong id="prompt">Слушайте два звука.</strong><small id="hintText">Выберите уровень и нажмите «Начать».</small></div>
<div class="answers" id="answers" role="group" aria-label="Какой интервал звучит?"></div>
<div class="perform" id="perform" hidden><strong id="performTitle">Сыграйте верхний звук</strong><small id="performStatus">Ответ принимается после звучания вопроса.</small><div class="live" id="performLive"></div></div>
<div class="feedback" id="feedback" aria-live="polite"></div><div class="explanation" id="explanation"></div>
<div class="summary" id="summary" hidden><h2>Итоги сессии</h2><p id="summaryMain"></p><div class="summary-table" id="summaryTable"></div><p id="summaryConfusion"></p><p id="summaryRecommendation"></p><button type="button" id="again">Ещё</button></div>
</section><div class="metrics" aria-label="Статистика упражнений"><div class="metric"><b id="total">0</b><span>ОТВЕТОВ</span></div><div class="metric"><b id="correct">0</b><span>ПРАВИЛЬНО</span></div><div class="metric"><b id="accuracy">—</b><span>ТОЧНОСТЬ</span></div><div class="metric"><b id="streak">0</b><span>СЕРИЯ</span></div><div class="metric"><b id="record">0</b><span>РЕКОРД</span></div></div><div class="bottom"><label><input id="sounds" type="checkbox" checked>Звуковые сигналы</label><button type="button" id="reset">Сбросить</button></div></main><div class="credits">Звук пианино: <a href="https://www.timbrechbill.com/soundfonts/">TimGM6mb</a> (Тим Брекбилл и Дэвид Болтон, <a href="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html">GPL-2.0</a>).</div>
<script src="./interval-audio-data.js"></script><script src="./interval-associations.js"></script><script src="./pitch-detector.js"></script><script src="./progress-store.js?v=20261128-tonal"></script><script src="./tonal-engine.js?v=20261128-tonal"></script><script src="./tonal-exercise.js?v=20261128-tonal"></script></body></html>
